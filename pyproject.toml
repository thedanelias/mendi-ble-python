[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mendi-ble"
version = "0.1.0"
description = "Python library for interfacing with Mendi fNIRS devices via Bluetooth Low Energy"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" },
]
keywords = ["fnirs", "ble", "bluetooth", "mendi", "neurofeedback", "brain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "bleak>=0.21.1",
    "aiofiles>=23.2.1",
    "numpy>=1.24.4",
    "loguru>=0.7.2",
    "click>=8.1.7",
    "msgpack>=1.0.7",
]

[project.optional-dependencies]
dev = [
    "black>=23.12.1",
    "isort>=5.13.2",
    "flake8>=7.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pylint>=3.0.3",
    "bandit>=1.7.6",
    "safety>=3.0.1",
]

docs = [
    "sphinx>=7.2.6",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.2",
    "myst-parser>=2.0.0",
    "sphinx-copybutton>=0.5.2",
]

analysis = [
    "pandas>=2.0.3",
    "matplotlib>=3.7.4",
    "seaborn>=0.13.1",
    "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/mendi-ble-python"
Documentation = "https://mendi-ble-python.readthedocs.io/"
Repository = "https://github.com/yourusername/mendi-ble-python"
Issues = "https://github.com/yourusername/mendi-ble-python/issues"

[project.scripts]
mendi-scan = "mendi_ble.cli:scan"
mendi-stream = "mendi_ble.cli:stream"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mendi_ble = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["mendi_ble"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
files = ["src/mendi_ble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=mendi_ble --cov-report=html --cov-report=term"

[tool.coverage.run]
source = ["src/mendi_ble"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pylint.messages_control]
disable = "C0330, C0326"

[tool.pylint.format]
max-line-length = "88"